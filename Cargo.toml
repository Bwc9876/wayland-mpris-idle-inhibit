[package]
name    = "wayland-mpris-idle-inhibit"
authors = ["Ben C <ben@bwc9876.dev>"]
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow            = "1.0.104"
clap              = { version = "4.6.7", features = ["derive"] }
colog             = "1.4.0"
log               = "0.4.34"
mpris             = "2.1.0"
wayland-client    = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
zbus              = { version = "6.0.0" }
tokio             = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
